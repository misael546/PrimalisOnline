name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!PROJECT_RULES.md"

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Primalis Online for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot 4 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "Godot Android SDK settings:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"

      - name: Import project and check resources
        run: godot --headless --editor --path . --quit

      - name: Install Android build template
        run: |
          godot --headless --editor --path . --install-android-build-template --quit
          test -d android/build

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PrimalisOnline.apk

      - name: Verify APK was created
        run: test -s build/PrimalisOnline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimalisOnline-Android-APK
          path: build/PrimalisOnline.apk
          if-no-files-found: error
          retention-days: 14
