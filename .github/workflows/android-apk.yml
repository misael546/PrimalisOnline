name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!PROJECT_RULES.md"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Export Primalis Online for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download required CC0 dinosaur, environment, PBR texture and sky assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/dinos assets/environment assets/textures assets/sky

          download_glb_required() {
            local source_url="$1"
            local destination="$2"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$source_url" -o "$destination"
            if [ "$(head -c 4 "$destination")" != "glTF" ] || [ "$(wc -c < "$destination")" -le 1024 ]; then
              echo "::error::Invalid GLB downloaded from $source_url"
              exit 1
            fi
            echo "Verified CC0 GLB $(basename "$destination"): $(wc -c < "$destination") bytes"
          }

          download_jpeg_required() {
            local source_url="$1"
            local destination="$2"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$source_url" -o "$destination"
            local signature
            signature="$(od -An -tx1 -N2 "$destination" | tr -d ' \n')"
            if [ "$signature" != "ffd8" ] || [ "$(wc -c < "$destination")" -le 10000 ]; then
              echo "::error::Invalid JPEG texture downloaded from $source_url"
              exit 1
            fi
            echo "Verified CC0 PBR texture $(basename "$destination"): $(wc -c < "$destination") bytes"
          }

          download_hdr_required() {
            local source_url="$1"
            local destination="$2"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$source_url" -o "$destination"
            if ! head -n 1 "$destination" | grep -q '#?RADIANCE' || [ "$(wc -c < "$destination")" -le 10000 ]; then
              echo "::error::Invalid HDRI downloaded from $source_url"
              exit 1
            fi
            echo "Verified CC0 sky HDRI $(basename "$destination"): $(wc -c < "$destination") bytes"
          }

          # Gobkit Free Dinosaur + Nature packs. The manifest explicitly states CC0 1.0.
          download_glb_required "https://gobkit.com/freebies/dino/Trex.glb" "assets/dinos/Trex.glb"
          download_glb_required "https://gobkit.com/freebies/dino/Stegosaurus.glb" "assets/dinos/Stegosaurus.glb"
          download_glb_required "https://gobkit.com/freebies/dino/Triceratops.glb" "assets/dinos/Triceratops.glb"
          download_glb_required "https://gobkit.com/freebies/dino/Ankylosaurus.glb" "assets/dinos/Ankylosaurus.glb"
          download_glb_required "https://gobkit.com/freebies/dino/Pachycephalosaurus.glb" "assets/dinos/Pachycephalosaurus.glb"
          download_glb_required "https://gobkit.com/freebies/dino/Oviraptor.glb" "assets/dinos/Oviraptor.glb"

          download_glb_required "https://gobkit.com/freebies/environment/TreeHigh001.glb" "assets/environment/TreeHigh001.glb"
          download_glb_required "https://gobkit.com/freebies/environment/TreeHigh002.glb" "assets/environment/TreeHigh002.glb"
          download_glb_required "https://gobkit.com/freebies/environment/TreeHigh003.glb" "assets/environment/TreeHigh003.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Bush001.glb" "assets/environment/Bush001.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Bush002.glb" "assets/environment/Bush002.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Grass001.glb" "assets/environment/Grass001.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Grass002.glb" "assets/environment/Grass002.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Grass003.glb" "assets/environment/Grass003.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Rock001.glb" "assets/environment/Rock001.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Rock002.glb" "assets/environment/Rock002.glb"
          download_glb_required "https://gobkit.com/freebies/environment/Rock003.glb" "assets/environment/Rock003.glb"
          download_glb_required "https://gobkit.com/freebies/environment/MountainFar001.glb" "assets/environment/MountainFar001.glb"
          download_glb_required "https://gobkit.com/freebies/environment/MountainFar002.glb" "assets/environment/MountainFar002.glb"
          download_glb_required "https://gobkit.com/freebies/environment/MountainFar003.glb" "assets/environment/MountainFar003.glb"

          # Poly Haven Forest Ground 01 PBR set (1K mobile-friendly maps), CC0 1.0.
          download_jpeg_required "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/forrest_ground_01/forrest_ground_01_diff_1k.jpg" "assets/textures/forrest_ground_01_diff_1k.jpg"
          download_jpeg_required "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/forrest_ground_01/forrest_ground_01_nor_gl_1k.jpg" "assets/textures/forrest_ground_01_nor_gl_1k.jpg"
          download_jpeg_required "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/forrest_ground_01/forrest_ground_01_rough_1k.jpg" "assets/textures/forrest_ground_01_rough_1k.jpg"
          # Poly Haven Kloppenheim 06 (Pure Sky) 1K HDRI, CC0 1.0.
          download_hdr_required "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloppenheim_06_puresky_1k.hdr" "assets/sky/kloppenheim_06_puresky_1k.hdr"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable test APK signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/primalis-debug.keystore
          key: primalis-online-debug-keystore-v1

      - name: Create test APK signing key when cache is empty
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/primalis-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Primalis Online Debug,O=Primalis Online,C=MX"

      - name: Save stable test APK signing key
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/primalis-debug.keystore
          key: primalis-online-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot 4 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "Godot Android SDK settings:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"

      - name: Import project and check resources
        run: godot --headless --editor --path . --quit

      - name: Run headless startup smoke test
        shell: bash
        run: |
          set -o pipefail
          output="$(godot --headless --path . --quit-after 5 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          if grep -E 'SCRIPT ERROR:|ERROR:' <<< "$output"; then
            echo "Godot reported an error during startup."
            exit 1
          fi

      - name: Validate imported dinosaur models and animations
        run: godot --headless --path . --script res://tests/asset_smoke_test.gd

      - name: Export signed debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/primalis-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PrimalisOnline.apk

      - name: Validate APK package, alignment, signature, and CPU support
        shell: bash
        run: |
          set -euo pipefail
          APK="build/PrimalisOnline.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          test -s "$APK"
          unzip -t "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > build/apk-badging.txt
          grep -F "package: name='com.primalis.online' versionCode='14' versionName='0.3.2'" build/apk-badging.txt
          grep -q "'armeabi-v7a'" build/apk-badging.txt
          grep -q "'arm64-v8a'" build/apk-badging.txt
          cat build/apk-badging.txt | head -n 12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimalisOnline-Android-APK
          path: build/PrimalisOnline.apk
          if-no-files-found: error
          retention-days: 14
